name: Source figure review (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-paper-figures
  cancel-in-progress: false

jobs:
  collect-source-figures:
    if: github.repository == 'vpraise00/vpraise00.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Original source figure audit for approved papers only
        run: python scripts/extract_paper_figures.py
      - name: Rebuild approved posts only
        run: python scripts/build_site.py
      - run: python -m unittest discover -s tests -v
      - name: Commit audited figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/figure_extract_status.json assets/paper-figures/ papers/ sitemap.xml feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update approved source figures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
