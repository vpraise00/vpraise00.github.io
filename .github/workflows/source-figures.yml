name: Source figure refresh

on:
  push:
    branches: [main]
    paths:
      - 'data/figure_catalog.json'
      - 'scripts/extract_paper_figures.py'
      - '.github/workflows/source-figures.yml'
  schedule:
    - cron: '35 0 * * *' # 09:35 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-paper-figures
  cancel-in-progress: false

jobs:
  collect-source-figures:
    if: github.repository == 'vpraise00/vpraise00.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source parser
        run: python -m pip install -r requirements.txt
      - name: Extract only figure-number-matched original paper figures
        run: python scripts/extract_paper_figures.py
      - name: Rebuild all 16 paper posts using collected source figure metadata
        run: python scripts/build_site.py
      - name: Test original-figure provenance and blog pages
        run: python -m unittest discover -s tests -v
      - name: Commit source figures and figure-aware posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/figure_extract_status.json assets/paper-figures/ papers/ sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo 'No source figure changes.'
          else
            git commit -m 'feat(figures): add source-matched originals and captions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
