name: Daily research discovery (review queue only)

on:
  schedule:
    # 10:00 Asia/Seoul (UTC 01:00). GitHub scheduling may be delayed.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-radar-editorial-queue
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'vpraise00/vpraise00.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline editorial safeguards
        run: python -m unittest discover -s tests -v
      - name: Check arXiv metadata and save candidate list (NEVER publish articles)
        run: python scripts/queue_candidates.py
      - name: Store candidate queue only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh research candidates for editorial review'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
